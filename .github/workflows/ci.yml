name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-build-test:
    name: Backend (.NET Build & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          dotnet-quality: 'preview'

      - name: Restaurar dependências
        run: dotnet restore EasyDelivery.slnx

      - name: Compilar solução
        run: dotnet build EasyDelivery.slnx --no-restore --configuration Release

      - name: Executar testes de unidade
        run: dotnet test EasyDelivery.Tests/EasyDelivery.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

  frontend-build:
    name: Frontend (Angular Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: easydelivery-front/package-lock.json

      - name: Instalar dependências
        working-directory: easydelivery-front
        run: npm ci

      - name: Compilar aplicação Angular
        working-directory: easydelivery-front
        run: npm run build
